<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Radio Tim Selector</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Cormorant+Garamond:wght@400;500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  body {
    background: radial-gradient(circle at top, #1a1a1a 0%, #000000 70%);
    color: #e8e8e8;
    font-family: 'Cormorant Garamond', serif;
    max-width: 460px;
    margin: 0 auto;
    padding: 30px 20px;
    min-height: 100vh;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-size: 28px;
    text-align: center;
    letter-spacing: 2px;
    background: linear-gradient(135deg, #d4af37 0%, #f4e5b2 25%, #c0c0c0 50%, #f4e5b2 75%, #d4af37 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
  }
  .subtitle {
    text-align: center; color: #9a9a9a; font-size: 14px;
    letter-spacing: 4px; text-transform: uppercase; margin-bottom: 30px;
  }
  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, #d4af37, #c0c0c0, #d4af37, transparent);
    margin: 20px 0 30px;
  }
  .connect-btn {
    width: 100%; padding: 16px; font-family: 'Playfair Display', serif; font-size: 17px;
    letter-spacing: 1px; background: linear-gradient(180deg, #2a2416, #0a0a0a);
    color: #f4e5b2; border: 1px solid #d4af37; border-radius: 2px; cursor: pointer;
  }
  .status-pill {
    text-align: center; font-size: 13px; color: #9a9a9a; margin: 10px 0 20px;
    letter-spacing: 1px;
  }
  .status-pill.connected { color: #a8d8a8; }
  .now-playing { text-align: center; font-size: 15px; color: #c0c0c0; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 4px; }
  .now-playing-name { text-align: center; font-family: 'Playfair Display', serif; font-size: 22px; color: #f4e5b2; margin-bottom: 20px; }
  .volume-section { margin: 25px 0 15px; }
  .volume-label { font-family: 'Playfair Display', serif; font-size: 15px; color: #c0c0c0; letter-spacing: 1px; text-align: center; margin-bottom: 10px; }
  input[type=range] {
    -webkit-appearance: none; width: 100%; height: 3px; border-radius: 2px;
    background: linear-gradient(90deg, #d4af37, #c0c0c0); outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 20px; height: 20px; border-radius: 50%;
    background: radial-gradient(circle, #f4e5b2, #d4af37); box-shadow: 0 0 8px #d4af37;
    cursor: pointer; border: 1px solid #c0c0c0;
  }
  .station-btn {
    width: 100%; padding: 16px 20px; font-family: 'Cormorant Garamond', serif; font-size: 19px;
    letter-spacing: 1.5px; text-transform: uppercase; background: linear-gradient(180deg, #1c1c1c, #0a0a0a);
    color: #e8e8e8; border: 1px solid #444; border-radius: 2px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    margin: 8px 0; transition: 0.2s;
  }
  .station-btn.active { border: 1px solid #d4af37; background: linear-gradient(180deg, #2a2416, #0a0a0a); color: #f4e5b2; }
  .gem {
    width: 8px; height: 8px; background: linear-gradient(135deg, #d4af37, #f4e5b2, #c0c0c0);
    border-radius: 50%; box-shadow: 0 0 6px #d4af37; display: inline-block;
  }
  .section { margin-top: 35px; border-top: 1px solid #333; padding-top: 25px; }
  .section-label {
    font-family: 'Playfair Display', serif; font-size: 16px; color: #c0c0c0;
    letter-spacing: 1px; margin-bottom: 12px; text-align: center;
  }
  input[type=text], input[type=password] {
    width: 100%; padding: 12px; margin: 6px 0; font-family: 'Cormorant Garamond', serif;
    font-size: 16px; background: #0f0f0f; border: 1px solid #444; color: #e8e8e8; border-radius: 2px;
  }
  .small-btn {
    width: 100%; padding: 12px; margin-top: 8px; font-family: 'Cormorant Garamond', serif;
    font-size: 16px; background: #1c1c1c; color: #c0c0c0; border: 1px solid #444;
    border-radius: 2px; cursor: pointer;
  }
  .hidden { display: none; }
  #wifiList { font-size: 14px; color: #9a9a9a; margin-top: 8px; }
  #wifiList div { padding: 6px 0; cursor: pointer; border-bottom: 1px solid #222; }
</style>
</head>
<body>

  <h1>Radio Selector</h1>
  <div class="subtitle">by TIM &mdash; Bluetooth</div>
  <div class="divider"></div>

  <button class="connect-btn" id="connectBtn">Se connecter en Bluetooth</button>
  <div class="status-pill" id="connStatus">Non connecte</div>

  <div id="mainPanel" class="hidden">
    <div class="now-playing">A l'ecoute</div>
    <div class="now-playing-name">&#9835; <span id="stationName">...</span></div>

    <div class="volume-section">
      <div class="volume-label">Volume &mdash; <span id="volVal">100</span>%</div>
      <input type="range" id="volSlider" min="0" max="100" value="100">
    </div>

    <div id="stationsList"></div>

    <div class="section">
      <div class="section-label">Configuration Wi-Fi</div>
      <button class="small-btn" id="scanWifiBtn">Scanner les reseaux</button>
      <div id="wifiList"></div>
      <input type="text" id="ssidInput" placeholder="Nom du reseau (SSID)">
      <input type="password" id="passInput" placeholder="Mot de passe">
      <button class="small-btn" id="saveWifiBtn">Enregistrer le Wi-Fi</button>
    </div>
  </div>

<script>
const SERVICE_UUID = '6e400001-b5a3-f393-e0a9-e50e24dcca9e';
const RX_UUID = '6e400002-b5a3-f393-e0a9-e50e24dcca9e'; // ecriture (vers l'ESP32)
const TX_UUID = '6e400003-b5a3-f393-e0a9-e50e24dcca9e'; // notification (depuis l'ESP32)

let bleDevice, bleServer, rxChar, txChar;
let stationsMap = {};

const connectBtn = document.getElementById('connectBtn');
const connStatus = document.getElementById('connStatus');
const mainPanel = document.getElementById('mainPanel');
const stationName = document.getElementById('stationName');
const volSlider = document.getElementById('volSlider');
const volVal = document.getElementById('volVal');
const stationsList = document.getElementById('stationsList');
const scanWifiBtn = document.getElementById('scanWifiBtn');
const wifiList = document.getElementById('wifiList');
const ssidInput = document.getElementById('ssidInput');
const passInput = document.getElementById('passInput');
const saveWifiBtn = document.getElementById('saveWifiBtn');

connectBtn.addEventListener('click', connectBLE);
scanWifiBtn.addEventListener('click', () => sendCommand('SCANWIFI'));
saveWifiBtn.addEventListener('click', () => {
  const ssid = ssidInput.value.trim();
  const pass = passInput.value;
  if (!ssid) { alert('Entre un nom de reseau'); return; }
  sendCommand('WIFI:' + ssid + '|' + pass);
});
volSlider.addEventListener('input', () => {
  volVal.textContent = volSlider.value;
});
volSlider.addEventListener('change', () => {
  sendCommand('VOL:' + volSlider.value);
});

async function connectBLE() {
  try {
    bleDevice = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SERVICE_UUID] }]
    });
    bleDevice.addEventListener('gattserverdisconnected', onDisconnected);
    bleServer = await bleDevice.gatt.connect();
    const service = await bleServer.getPrimaryService(SERVICE_UUID);
    rxChar = await service.getCharacteristic(RX_UUID);
    txChar = await service.getCharacteristic(TX_UUID);
    await txChar.startNotifications();
    txChar.addEventListener('characteristicvaluechanged', handleNotification);

    connStatus.textContent = 'Connecte a ' + bleDevice.name;
    connStatus.classList.add('connected');
    mainPanel.classList.remove('hidden');
    connectBtn.textContent = 'Connecte';

    sendCommand('STATUS');
    sendCommand('STATIONS');
  } catch (err) {
    console.error(err);
    alert('Connexion Bluetooth annulee ou echouee : ' + err);
  }
}

function onDisconnected() {
  connStatus.textContent = 'Deconnecte';
  connStatus.classList.remove('connected');
  connectBtn.textContent = 'Se connecter en Bluetooth';
}

async function sendCommand(cmd) {
  if (!rxChar) return;
  const encoder = new TextEncoder();
  try {
    await rxChar.writeValue(encoder.encode(cmd));
  } catch (err) {
    console.error('Erreur envoi commande', err);
  }
}

function handleNotification(event) {
  const value = new TextDecoder().decode(event.target.value);
  console.log('Recu :', value);

  if (value.startsWith('STATUS:')) {
    const parts = value.substring(7).split('|');
    const data = {};
    parts.forEach(p => {
      const [k, v] = p.split('=');
      data[k] = v;
    });
    if (data.station) {
      stationName.textContent = data.station;
      highlightActiveStation(data.station);
    }
    if (data.vol) {
      volSlider.value = data.vol;
      volVal.textContent = data.vol;
    }
  } else if (value.startsWith('STATIONS:')) {
    stationsMap = {};
    const entries = value.substring(9).split(';');
    stationsList.innerHTML = '';
    entries.forEach(e => {
      const [idx, name] = e.split('=');
      if (!name) return;
      stationsMap[idx] = name;
      const btn = document.createElement('button');
      btn.className = 'station-btn';
      btn.dataset.name = name;
      btn.textContent = name;
      btn.addEventListener('click', () => sendCommand('STATION:' + idx));
      stationsList.appendChild(btn);
    });
  } else if (value.startsWith('WIFILIST:')) {
    wifiList.innerHTML = '';
    const entries = value.substring(9).split(';');
    entries.forEach(e => {
      const [idx, ssid] = e.split('=');
      if (!ssid) return;
      const div = document.createElement('div');
      div.textContent = ssid;
      div.addEventListener('click', () => { ssidInput.value = ssid; });
      wifiList.appendChild(div);
    });
  } else if (value.startsWith('ERR:')) {
    console.warn(value);
  }
}

function highlightActiveStation(name) {
  document.querySelectorAll('.station-btn').forEach(btn => {
    const isActive = btn.dataset.name === name;
    btn.classList.toggle('active', isActive);
    btn.innerHTML = isActive ? '<span class="gem"></span>' + btn.dataset.name + '<span class="gem"></span>' : btn.dataset.name;
  });
}
</script>
</body>
</html>
